services:
  app:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost/auth}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-akpedia}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-akpedia-client}
    container_name: akpedia-client
    ports:
      - '5173:80'
